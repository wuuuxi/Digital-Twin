[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitaltwin"
version = "0.1.0"
description = "Reusable data-processing and biomechanics tools for digital-twin experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "psutil>=5.8",
]

[project.optional-dependencies]
opensim = ["opensim>=4.5"]
realtime = ["pygame>=2.6"]
optimization = ["pyomo>=6.0"]
all = [
    "opensim>=4.5",
    "pygame>=2.6",
    "pyomo>=6.0",
]

[tool.setuptools.packages.find]
include = ["digitaltwin*"]
